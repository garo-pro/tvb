name: Feature request
description: Suggest something new or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could TV-Blind help?
      description: Your idea, including how you would like it to work from the keyboard and what it should announce.
  - type: textarea
    id: other
    attributes:
      label: Anything else?
