name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build a
# release. The release is created as a draft so it can be reviewed first;
# the updater only sees it once it is published.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    name: Build, sign and draft release
    runs-on: windows-latest
    # Holds the signing key; only main and v* tags may use it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test --locked --workspace

      - name: Build
        run: cargo build --locked --release --workspace

      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-about@0.9.2

      - name: Third-party license notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Sign
        env:
          TVB_SIGNING_KEY: ${{ secrets.TVB_SIGNING_KEY }}
          TVB_SIGNING_PASSWORD: ${{ secrets.TVB_SIGNING_PASSWORD }}
        run: target/release/tvb-sign.exe sign dist/TV-Blind.zip

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Download

          Download **TV-Blind.zip**, extract it, and run **TV-Blind.exe**. No installer is needed. If you already have TV-Blind, it offers this update itself.

          By downloading or using TV-Blind you accept the [license](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/eula.md). How the app handles data is described in the [privacy policy](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/privacy-policy.md).

          "@
          gh release create "${{ github.ref_name }}" dist/TV-Blind.zip dist/TV-Blind.zip.minisig dist/TV-Blind.zip.sha256 `
            --repo "${{ github.repository }}" --draft --title "TV-Blind $env:VERSION" `
            --notes "$notes" --generate-notes
