# cargo-deny: licenses, security advisories, duplicate/banned crates, sources.
# Run locally with `cargo deny check`.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Unmaintained or yanked crates and any known vulnerability fail the check.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# tvb itself is not published to crates.io.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Prism bindings (speech output) and ship-shape 0.3 (updater) are not on crates.io.
allow-git = ["https://github.com/garo-pro/prism2rust", "https://github.com/trypsynth/ship-shape"]
